# ============================================================
# 🦙 local-llama — pixi 管理 llama.cpp / vLLM / SGLang 环境
#
# 常用命令:
#   pixi install -e llamacpp-cuda          # 安装 CUDA 环境
#   pixi run -e llamacpp-cuda llamacpp-build     # 下载源码并编译 + 安装
#   pixi run -e llamacpp-cuda llamacpp-verify    # 验证安装（bin + --version + GPU 设备）
#   pixi run -e llamacpp-cuda llamacpp-path      # 打印 llama-server 绝对路径
#
#   pixi install -e llamacpp-vulkan        # 安装 Vulkan 环境
#   pixi run -e llamacpp-vulkan llamacpp-build
#   pixi run -e llamacpp-vulkan llamacpp-verify
#   pixi run -e llamacpp-vulkan llamacpp-path
#
#   pixi install -e sdcpp-vulkan           # 安装 stable-diffusion.cpp Vulkan 环境
#   pixi run -e sdcpp-vulkan sdcpp-build
#   pixi run -e sdcpp-vulkan sdcpp-verify
#   pixi run -e sdcpp-vulkan sdcpp-path
#
#   pixi install -e sdcpp-cuda             # 安装 stable-diffusion.cpp CUDA 环境（需 N 卡）
#   pixi run -e sdcpp-cuda sdcpp-build
#   pixi run -e sdcpp-cuda sdcpp-verify
#   pixi run -e sdcpp-cuda sdcpp-path
#
#   pixi install -e strata-cuda            # 安装 Strata CUDA 环境（引擎 + Python 终端，需 N 卡 sm_75+）
#   pixi run -e strata-cuda strata-build   # 下载源码并编译 + 安装（引擎/终端到 $CONDA_PREFIX）
#   pixi run -e strata-cuda strata-verify  # 验证安装（--version + GPU 检测 + python 依赖）
#   pixi run -e strata-cuda strata-path    # 打印 strata-engine 绝对路径
#
#   pixi install -e maya-cuda              # 安装 Project Maya CUDA 环境（DeepSeek 引擎 + Python 服务）
#   pixi run -e maya-cuda maya-build       # 下载源码并编译 + 安装（引擎/服务到 $CONDA_PREFIX）
#   pixi run -e maya-cuda maya-verify      # 验证安装（--version + GPU 自检 + python 依赖）
#   pixi run -e maya-cuda maya-pack        # 从已下载的模型目录生成 DeepSeek pack
#   pixi run -e maya-cuda maya-path        # 打印 maya 启动器绝对路径
#
#   pixi install -e vllm-cuda              # 安装 vLLM 环境（PyPI 最新版 + torch cu130）
#   pixi run -e vllm-cuda vllm-cuda-prepare      # 整理 pip nvidia 包为标准 CUDA toolkit 布局
#   pixi run -e vllm-cuda vllm-cuda-verify       # 验证安装（import/CUDA + 工具链 + flashinfer JIT）
#
#   pixi install -e sglang-cuda            # 安装 SGLang 环境（PyPI 最新版 + torch cu130）
#   pixi run -e sglang-cuda sglang-cuda-prepare  # 整理 pip nvidia 包为标准 CUDA toolkit 布局
#   pixi run -e sglang-cuda sglang-cuda-verify   # 验证安装（版本 + CUDA + 工具链信息）
# ============================================================

[workspace]
name = "🦙"
version = "0.1.0"
description = "Local LLM inference: llama.cpp / vLLM / SGLang environments managed by Pixi"
authors = ["shmilee <shmilee.zju@gmail.com>"]
channels = ["conda-forge"]
platforms = [
    # 标准 linux-64 平台（llama.cpp Vulkan）
    # 注意：与标准 subdir 相同 name 的平台不能携带自定义 virtual package（如 glibc pin）
    #       —— 如需 pin glibc，必须给平台另起名字
    "linux-64",
    # 平台：CUDA 13.x, llama.cpp CUDA / vLLM / SGLang
    { name = "linux-64-cu13", platform = "linux-64", cuda = "13.2", glibc = "2.39" },
]

# https://pixi.prefix.dev/latest/workspace/environment/#activation
[target.unix.activation.env]
PIXI_CHANGE_PS1 = "true"
# 隔离 Python user-site（~/.local）包：user-site 在 sys.path 中先于环境
# site-packages，会遮蔽环境内同名包（如 ~/.local 的旧 huggingface_hub
# 遮蔽环境内版本，导致 transformers import 失败）。
PYTHONNOUSERSITE = "1"

[pypi-options]
#index-url = "https://pypi.org/simple"
index-url = "https://mirrors.aliyun.com/pypi/simple"
#index-url = "https://mirror.sjtu.edu.cn/pypi/web/simple"
#index-url = "https://mirrors.ustc.edu.cn/pypi/simple"
#index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

# torch 系 cu130 wheel 从国内镜像取（等价 pip --find-links）：
# 南大/上交的 wheel 文件在 cu130/ 根下，但列表页按项目分子目录，
# 故 find-links 指向各项目的子目录；阿里云是 flat-file 布局，直接指向根目录。
# 官方源: https://download.pytorch.org/whl/cu130
# 按下载速度排序。
find-links = [
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130/torch" },
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130/torchaudio" },
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130/torchvision" },
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu130/torchcodec" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu130/torch" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu130/torchaudio" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu130/torchvision" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu130/torchcodec" },
    { url = "https://mirrors.aliyun.com/pytorch-wheels/cu130" },
    # cu132 目录（vllm-nightly 用：vLLM nightly 官方按 CUDA 13.2 构建，与平台
    # 声明 cuda=13.2 匹配；南大/上交镜像均全量同步。官方源:
    # https://download.pytorch.org/whl/cu132）
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu132/torch" },
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu132/torchaudio" },
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu132/torchvision" },
    { url = "https://mirrors.nju.edu.cn/pytorch/whl/cu132/torchcodec" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu132/torch" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu132/torchaudio" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu132/torchvision" },
    { url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu132/torchcodec" },
]



# ============================================================
# Feature: llama.cpp 公共基础
# （编译工具、编译器、基础运行库、版本变量、共用任务）
# ============================================================
[feature.llama-base.dependencies]
# --- 编译工具（cmake >=3.24 才支持 CMAKE_CUDA_ARCHITECTURES=native）---
cmake = ">=3.24"
ninja = ">=1.11"
curl = "*"
# --- C/C++ 编译器（gcc_linux-64 同时作为 nvcc 的 host 编译器）---
gcc_linux-64 = ">=13"
gxx_linux-64 = ">=13"
# --- 基础运行库 ---
libcurl = "*"
openssl = "*"
libgomp = "*"

[feature.llama-base.activation.env]
# 让 CMake 优先在 pixi 环境内查找依赖，而不是系统路径
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"

# llama.cpp 版本号（对应 GitHub release tag）
LLAMACPP_VERSION = "b12500"
# 注意：LLAMACPP_BACKEND 只在各后端 feature 中定义
# （pixi 多个 feature 定义同名环境变量时，feature 列表靠前者获胜，
#   base 里绝不能定义该变量，否则会静默覆盖 backend feature 的值）
# LLAMACPP_BUILD_DIR 为可选覆盖项（llamacpp-build.sh 默认派生 build-$BACKEND）

[feature.llama-base.tasks]
# 下载 + 解压源码与 UI 包到 download/（幂等，可重复执行）
# UI 包用于离线环境：CMake 发现 tools/ui/dist 已有 index.html 时不再联网构建
llamacpp-src = "bash $PIXI_PROJECT_ROOT/scripts/llamacpp-src.sh"

# 打印 llama-server 绝对路径（llamacpp-build 安装到 $CONDA_PREFIX/bin）
llamacpp-path = "which llama-server"

# 编译 + 安装（安装到 $CONDA_PREFIX/bin，RPATH 相对定位 lib）
# 后端由 $LLAMACPP_BACKEND 自动区分（各 backend feature 单独定义）
[feature.llama-base.tasks.llamacpp-build]
depends-on = ["llamacpp-src"]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/llamacpp-build.sh"

# 验证安装：bin 存在 + --version + 运行时能检测到对应后端 GPU
[feature.llama-base.tasks.llamacpp-verify]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/llamacpp-verify.sh"


# ============================================================
# Feature: llama.cpp (CUDA, 源码编译)
# ============================================================
[feature.llamacpp-cuda]
platforms = ["linux-64-cu13"]

[feature.llamacpp-cuda.dependencies]
# --- CUDA 编译栈（conda-forge 拆分包，pin 到 13.2 匹配平台声明）---
# cuda-version 是 noarch 版本锁定包，使下列包全部解析到 CUDA 13.2 栈。
# 注意：各库有独立版本号（如 cuBLAS 在 13.2 栈中是 13.3/13.4），
#       所以这里只 pin cuda-version，其余用 * 让求解器自动匹配。
cuda-version = "=13.2"
# nvcc 编译器（$CONDA_PREFIX/bin/nvcc）
cuda-nvcc = "*"
# CUDA Runtime（ggml-cuda 硬依赖 CUDA::cudart）
cuda-cudart-dev = "*"
# cuBLAS（ggml-cuda 无条件链接 CUDA::cublas）
libcublas-dev = "*"
# --- 可选 ---
# NCCL：仅 -DGGML_CUDA_NCCL=ON 时需要（多卡 NCCL 通信）
# nccl = "2.*"
# 说明：llama.cpp 的 CUDA 后端（ggml-cuda）是自包含实现，不需要 cuDNN。

[feature.llamacpp-cuda.activation.env]
CUDACXX = "$CONDA_PREFIX/bin/nvcc"
# 后端标识（共用任务 llamacpp-build / llamacpp-verify 据此区分）
LLAMACPP_BACKEND = "cuda"


# ============================================================
# Feature: llama.cpp (Vulkan, 源码编译)
# ============================================================
[feature.llamacpp-vulkan]
platforms = ["linux-64"]

[feature.llamacpp-vulkan.dependencies]
# --- Vulkan 编译与运行时依赖 ---
libvulkan-loader = "*"        # Vulkan ICD 加载器（运行时）
libvulkan-headers = "*"       # Vulkan API 头文件（注意不是过时的 vulkan-headers）
spirv-headers = "*"
spirv-tools = "*"
shaderc = "*"                 # 提供 glslc，编译 GLSL 着色器

[feature.llamacpp-vulkan.activation.env]
# 后端标识（共用任务 llamacpp-build / llamacpp-verify 据此区分）
LLAMACPP_BACKEND = "vulkan"


# ============================================================
# Feature: stable-diffusion.cpp 公共基础
# （编译工具、编译器、版本变量、共用任务）
# 结构与 llama-base 对齐；sd.cpp 无 HTTP/UI 运行依赖，
# 故不需要 libcurl / openssl（sd-server 用内置 httplib）。
# ============================================================
[feature.sdcpp-base.dependencies]
cmake = ">=3.24"
ninja = ">=1.11"
gcc_linux-64 = ">=13"
gxx_linux-64 = ">=13"
libgomp = "*"

[feature.sdcpp-base.activation.env]
# 让 CMake 优先在 pixi 环境内查找依赖，而不是系统路径
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"

# stable-diffusion.cpp 版本号（对应 GitHub release tag，master-NNNN-<sha> 风格）
SDCPP_VERSION = "master-1086-465adf3"
# 注意：SDCPP_BACKEND 只在各后端 feature 中定义（与 LLAMACPP_BACKEND 同理，
# 多个 feature 定义同名环境变量时 feature 列表靠前者获胜）
# SDCPP_BUILD_DIR 为可选覆盖项（sdcpp-build.sh 默认派生 build-$BACKEND）

[feature.sdcpp-base.tasks]
# 下载 + 解压源码到 download/（幂等，可重复执行）
sdcpp-src = "bash $PIXI_PROJECT_ROOT/scripts/sdcpp-src.sh"

# 打印 sd-cli 绝对路径
sdcpp-path = "which sd-cli"

# 编译 + 安装（安装到 $CONDA_PREFIX/bin，静态库，二进制自包含）
# 后端由 $SDCPP_BACKEND 自动区分（各 backend feature 单独定义）
[feature.sdcpp-base.tasks.sdcpp-build]
depends-on = ["sdcpp-src"]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/sdcpp-build.sh"

# 验证安装：bin 存在 + --version + 运行时能检测到对应后端 GPU
[feature.sdcpp-base.tasks.sdcpp-verify]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/sdcpp-verify.sh"


# ============================================================
# Feature: stable-diffusion.cpp (Vulkan, 源码编译)
# ============================================================
[feature.sdcpp-vulkan]
platforms = ["linux-64"]

[feature.sdcpp-vulkan.dependencies]
# --- Vulkan 编译与运行时依赖 ---
libvulkan-loader = "*"        # Vulkan ICD 加载器（运行时）
libvulkan-headers = "*"
spirv-headers = "*"
spirv-tools = "*"
shaderc = "*"                  # 提供 glslc，编译 GLSL 着色器

[feature.sdcpp-vulkan.activation.env]
# 后端标识（共用任务 sdcpp-build / sdcpp-verify 据此区分）
SDCPP_BACKEND = "vulkan"


# ============================================================
# Feature: stable-diffusion.cpp (CUDA, 源码编译)
# ============================================================
[feature.sdcpp-cuda]
platforms = ["linux-64-cu13"]

[feature.sdcpp-cuda.dependencies]
# --- CUDA 编译栈（conda-forge 拆分包，pin 到 13.2 匹配平台声明）---
# 依赖链与 llamacpp-cuda 相同：ggml-cuda 后端链接 CUDA::cudart /
# CUDA::cublas / CUDA::cublasLt / CUDA::cuda_driver，sd.cpp 自身的
# src/core/cuda 扩展另需 nvcc（enable_language(CUDA)）。
cuda-version = "=13.2"
# nvcc 编译器（$CONDA_PREFIX/bin/nvcc）
cuda-nvcc = "*"
# CUDA Runtime（ggml-cuda 与 sd-core 均链接 CUDA::cudart）
cuda-cudart-dev = "*"
# cuBLAS（ggml-cuda 无条件链接 CUDA::cublas；CUDA>=11.8 另有 CUDA::cublasLt）
libcublas-dev = "*"

[feature.sdcpp-cuda.activation.env]
CUDACXX = "$CONDA_PREFIX/bin/nvcc"
# 后端标识（共用任务 sdcpp-build / sdcpp-verify 据此区分）
SDCPP_BACKEND = "cuda"


# ============================================================
# Feature: Strata 公共基础
# （编译工具、编译器、版本变量、共用任务）
# 结构与 llama-base 对齐。Strata 的 CUDA 引擎比 ggml-cuda 多一个
# 独立 DSO（libstrata_kq，K-quant MMQ prompt kernels，引擎从自己的
# 目录 dlopen 它），且仓库无 CMake install 规则，故需 patchelf 设置
# RPATH 指向环境 lib。
# ============================================================
[feature.strata-base.dependencies]
cmake = ">=3.24"
ninja = ">=1.11"
curl = "*"
gcc_linux-64 = ">=13"
gxx_linux-64 = ">=13"
libgomp = "*"
# Strata 引擎无 CMake install 规则：strata-build.sh 手动拷贝二进制后
# 用 patchelf 把 RPATH 设为 $ORIGIN/../lib（环境内的 CUDA 运行库）
patchelf = "*"

[feature.strata-base.activation.env]
# 让 CMake 优先在 pixi 环境内查找依赖，而不是系统路径
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"

# Strata 版本号（对应 GitHub release tag）
# 0.2.14 起上游移除了 DeepSeek（dsv41）引擎（#6072/#6048），本环境只保留
# 主引擎（flash_next 形状，Qwen3.8-Flash-Next）+ 图片编码器 + 终端。
# v0.2.20（引擎 0.1.66）：0.2.14 起的自有 prompt 内核在 QFN 上实测比
# 0.1.49.2 快（131k prefill 5,068 → 5,960 tok/s）。
# DeepSeek-V4.1 的引擎改用独立环境（Project Maya，见 maya-* 任务）。
STRATA_VERSION = "v0.2.20"
# 说明：CMake 的 project VERSION 是引擎内部版本（0.1.66），
#       v0.2.20 是发布版本（tag / 安装器 / strata --version 语义的"应用版本"）
# STRATA_BUILD_DIR 为可选覆盖项（strata-build.sh 默认派生 build-$BACKEND）

[feature.strata-base.tasks]
# 下载 + 解压源码到 download/（幂等，可重复执行）
strata-src = "bash $PIXI_PROJECT_ROOT/scripts/strata-src.sh"

# 打印 strata-engine 绝对路径（strata-build 安装到 $CONDA_PREFIX/bin）
strata-path = "which strata-engine"

# 准备 run pack（strata-packs/，模型文件只读；缺 tokenizer/vocab.json 时
# 终端拒绝启动）。all=两个都备（默认）；幂等，已完整跳过，--force 重建
strata-pack = "bash $PIXI_PROJECT_ROOT/scripts/strata-pack.sh qwen"
strata-pack-qwen = "bash $PIXI_PROJECT_ROOT/scripts/strata-pack.sh qwen"

# 编译 + 安装（引擎/终端安装到 $CONDA_PREFIX，RPATH 相对定位 lib）
# 后端由 $STRATA_BACKEND 自动区分（各 backend feature 单独定义）
[feature.strata-base.tasks.strata-build]
depends-on = ["strata-src"]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/strata-build.sh"

# 验证安装：bin 存在 + --version + 运行时能检测到对应后端 GPU
[feature.strata-base.tasks.strata-verify]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/strata-verify.sh"


# ============================================================
# Feature: Strata (CUDA, 源码编译)
#
# CUDA 依赖链与 llamacpp-cuda 相同（find_package(CUDAToolkit) 需要
# cudart + cublas；引擎同时静态链接 ggml-cpu，CPU 回退可用）。
# 内核要求 sm_75+（tf32 mma / bf16），RTX 50 (sm_120) 需要 CUDA >= 13.0，
# 与本平台声明的 13.2 匹配。
#
# Python 终端（strata serve / status / launch）随环境一起安装：
# 引擎二进制是 generate 程序，OpenAI 兼容 API 服务由仓库内 Python
# server（serve/）驱动，运行依赖与仓库 requirements.txt 的 pin 一致。
# strata-build 默认构建三个产物：主引擎 strata-engine、DeepSeek-V4.1
# 引擎 strata-dsv41（独立构建目录）、图片编码器 strata-vision
# （tools/vision 独立 CMake 工程，QFN 多模态必需——缺它带 vision 段的
# run config 起不来）。
# ============================================================
[feature.strata-cuda]
platforms = ["linux-64-cu13"]

[feature.strata-cuda.dependencies]
# --- CUDA 编译栈（conda-forge 拆分包，pin 到 13.2 匹配平台声明）---
cuda-version = "=13.2"
# nvcc 编译器（$CONDA_PREFIX/bin/nvcc）
cuda-nvcc = "*"
# CUDA Runtime（strata_core / strata_mmq 链接 CUDA::cudart）
cuda-cudart-dev = "*"
# cuBLAS（strata_kernels 链接 CUDA::cublas；cublasLt 随 libcublas-dev 提供）
libcublas-dev = "*"
# --- Python 终端 ---
python = "3.12.*"

[feature.strata-cuda.activation.env]
CUDACXX = "$CONDA_PREFIX/bin/nvcc"
# 后端标识（共用任务 strata-build / strata-verify 据此区分）
STRATA_BACKEND = "cuda"
# Python 终端入口（strata.py / strata_cli / serve / data / tools），
# strata-build 拷贝到此目录；bin/strata 启动器据此找到 strata.py
PYTHONPATH = "$CONDA_PREFIX/strata"

[feature.strata-cuda.pypi-dependencies]
# API server 运行依赖（strata.py 的 preflight 检查这 7 个包），
# pin 与仓库 requirements.txt 一致（python 3.12 分支）
jinja2 = "==3.1.6"
pyyaml = "==6.0.3"
regex = "==2026.9.10"
psutil = "==7.2.2"
requests = "==2.34.2"
numpy = "==2.5.3"
pillow = "==12.3.0"
tqdm = "==4.70.1"


# ============================================================
# Feature: Project Maya 公共基础
#
# 结构与 strata-base 对齐。Maya 的 DeepSeek 引擎 maya-ds4 与 Strata
# dsv41 同血脉（上游从 Maya 移植），但模型格式互不通用：Maya 吃自家
# GGUF / Unsloth GGUF / EXL3，不吃 ISTA-DAS 的 GSQ-RCO。
#
# 上游把引擎和服务放在源码树里（build/maya-ds4 + maya.py + serve/），
# maya.py 以自身位置定 ROOT，并在 start 时检查 build/MAYA-BUILD.json
# 决定是否重编。因此安装策略是：整棵源码树拷到 $CONDA_PREFIX/maya，
# 引擎装进它的 build/（不写 MAYA-BUILD.json，避免 llama-swap 启动时
# 触发意外重编译），bin/maya 只是环境 python 的启动器。
# ============================================================
[feature.maya-base.dependencies]
cmake = ">=3.24"
ninja = ">=1.11"
curl = "*"
gcc_linux-64 = ">=13"
gxx_linux-64 = ">=13"
libgomp = "*"
# 上游 CMake 无 install 规则：maya-build.sh 手动拷贝二进制后，用
# patchelf 把 RPATH 设为环境内 CUDA 运行库（$ORIGIN/../../lib）。
patchelf = "*"

[feature.maya-base.activation.env]
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"

# Maya 版本号（对应 GitHub release tag；引擎 --version 里的 release）
# 说明：上游 VERSION 文件是引擎/服务版本（1.1.76），tag 同名 v1.1.76。
MAYA_VERSION = "v1.1.76"
# MAYA_BUILD_DIR 为可选覆盖项（maya-build.sh 默认 build-$BACKEND）

[feature.maya-base.tasks]
# 下载 + 解压源码到 download/（幂等）；同时预取 CMake 需要的
# llama.cpp pin（3cf03257，与 strata-src 同一个 commit）
maya-src = "bash $PIXI_PROJECT_ROOT/scripts/maya-src.sh"

# 打印 maya 启动器绝对路径（maya-build 装到 $CONDA_PREFIX/bin）
maya-path = "which maya"

# 从已下载的 DeepSeek 模型目录生成 pack（产物在模型目录的 maya-ds4/，
# 需模型目录可写；目标目录可由 $MAYA_DS4_MODEL_DIR 覆盖）
maya-pack = "bash $PIXI_PROJECT_ROOT/scripts/maya-pack.sh"

# 编译 + 安装（源码树/引擎/服务安装到 $CONDA_PREFIX）
[feature.maya-base.tasks.maya-build]
depends-on = ["maya-src"]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/maya-build.sh"

# 验证安装：bin + --version + GPU 自检 + python 依赖
[feature.maya-base.tasks.maya-verify]
cmd = "bash $PIXI_PROJECT_ROOT/scripts/maya-verify.sh"


# ============================================================
# Feature: Project Maya (CUDA, 源码编译)
#
# 依赖链与 strata-cuda 相同。Maya 的 DS4 引擎 include 了
# cuda_profiler_api.h（ds4_main.cpp），GLM 路径还用 NVTX
# （nvtx3/nvToolsExt.h），所以除 nvcc/cudart/cublas 外补
# cuda-profiler-api 与 cuda-nvtx 两个 conda 拆分包。
#
# 只构建 DeepSeek 引擎 maya-ds4 + 诊断程序 strata-device：
# Qwen3.8-Flash-Next 仍走 strata-cuda，避免重复构建 maya 主引擎。
# ============================================================
[feature.maya-cuda]
platforms = ["linux-64-cu13"]

[feature.maya-cuda.dependencies]
# --- CUDA 编译栈（conda-forge 拆分包，pin 到 13.2 匹配平台声明）---
cuda-version = "=13.2"
# nvcc 编译器（$CONDA_PREFIX/bin/nvcc）
cuda-nvcc = "*"
# CUDA Runtime（maya_core / maya_kernels 链接 CUDA::cudart）
cuda-cudart-dev = "*"
# cuBLAS（maya_kernels 链接 CUDA::cublas；cublasLt 随 libcublas-dev 提供）
libcublas-dev = "*"
# ds4_main.cpp 的 cuda_profiler_api.h（CUDA 13 拆分包）
cuda-profiler-api = "*"
# GLM 路径的 nvtx3/nvToolsExt.h（maya-ds4 不直接链接，但保留完整
# 工具链，便于以后构建 maya 主引擎）。conda 的 cuda-nvtx 只带运行库，
# 头文件用 NVIDIA 的 pip wheel 提供（见 pypi-dependencies + CPATH）。
cuda-nvtx = "*"
# --- Python 服务（maya.py / serve/）---
python = "3.12.*"

[feature.maya-cuda.activation.env]
CUDACXX = "$CONDA_PREFIX/bin/nvcc"
# 后端标识（maya-build / maya-verify 据此区分）
MAYA_BACKEND = "cuda"
# Python 服务入口（maya.py / serve / tools / data），maya-build 拷贝
# 到此目录；bin/maya 启动器据此找到 maya.py
PYTHONPATH = "$CONDA_PREFIX/maya"
# maya.py 在 sys.prefix == sys.base_prefix（conda/pixi python 就是）
# 时会 exec 到 maya.sh，自建 .venv 并丢掉环境包。MAYA_SH=1 跳过这条
# 分支，固定用 pixi 环境的 python 与 site-packages。
MAYA_SH = "1"
# nvtx3/nvToolsExt.h 来自 pypi 的 nvidia-nvtx wheel（conda 包只有 .so）
CPATH = "$CONDA_PREFIX/lib/python3.12/site-packages/nvidia/cu13/include"
# 版本由 pixi 管理：关掉 dashboard 的 GitHub 更新检查（本机不可达）
MAYA_UPDATE_CHECK = "0"

[feature.maya-cuda.pypi-dependencies]
# maya.py 的 preflight 依赖（setup.py PY_PACKAGES；python 3.12 分支）
# 版本与 strata-cuda 的终端保持一致；jsonschema 为上游新增依赖。
jinja2 = "==3.1.6"
pyyaml = "==6.0.3"
regex = "==2026.9.10"
psutil = "==7.2.2"
requests = "==2.34.2"
numpy = "==2.5.3"
pillow = "==12.3.0"
tqdm = "==4.70.1"
jsonschema = ">=4.18,<5"
# nvtx3/nvToolsExt.h（GLM 引擎 maya 编译需要；版本与 CUDA 13.2 对齐）
nvidia-nvtx = "==13.2.86"


# ============================================================
# Feature: vLLM (PyPI, CUDA 13 后端)
#
# 直接从 PyPI 安装（conda-forge 无对应包）。vLLM 严格 pin torch 版本，
# PyPI 默认 torch wheel 是 CUDA 12 构建，因此 torch 系四件套须显式
# 从 download.pytorch.org 的 cu130 index 取。
#
# CUDA 运行时与编译工具链全部自包含于 torch wheel 依赖的 nvidia-*-cu13
# pip 包（site-packages/nvidia/cu13/），不依赖系统 /usr/local/cuda，
# 也不装 conda cuda 包。唯一系统依赖：NVIDIA 驱动（libcuda.so.1）。
# vllm-cuda-prepare 任务将 pip 包布局整理为标准 CUDA toolkit 目录结构
# （$CONDA_PREFIX/vllm-cuda/{bin,include,lib,lib64}），供
# flashinfer JIT 与 torch inductor 按 CUDA_HOME 查找。
# ============================================================
[feature.vllm-cuda]
platforms = ["linux-64-cu13"]

[feature.vllm-cuda.dependencies]
python = "3.12.*"
# flashinfer JIT 与 torch cpp_extension 的 host 编译器。
# nvcc 的 -ccbin 默认指向 $CUDA_HOME/bin，与 CXX 保持同一编译器。
gxx_linux-64 = ">=13"

[feature.vllm-cuda.activation.env]
# vLLM 的 has_flashinfer() 用 shutil.which("nvcc")（PATH 查找）判断
# flashinfer 是否可用，须把 nvcc 放进 PATH。
PATH = "$CONDA_PREFIX/vllm-cuda/bin:$PATH"
# flashinfer（get_cuda_path）与 torch inductor 的 nvcc/头文件来源。
# vllm-cuda-prepare 生成的标准 CUDA toolkit 布局。
CUDA_HOME = "$CONDA_PREFIX/vllm-cuda"
# 显式指定 nvcc 路径，不依赖 PATH 查找。
CUDACXX = "$CONDA_PREFIX/vllm-cuda/bin/nvcc"
# flashinfer 链接步骤的 C++ 编译器。conda-forge g++ 无裸名符号链接，
# 须用交叉编译全名。
CXX = "x86_64-conda-linux-gnu-g++"
# flashinfer 对 SM12.x 默认要求 CUDA>=12.9（compute_120f）。
# 显式指定 12.0a 匹配 Blackwell (SM120) 硬件。
FLASHINFER_CUDA_ARCH_LIST = "12.0a"
# PyPI 的 nvidia-cuda-nvcc (13.4) 与 nvidia-cuda-runtime (13.0) 版本独立，
# CCCL 头文件的编译器/工具链 minor 一致性检查会误报。
# 用官方 define 关闭（13.4 编译 13.0 头文件无实际兼容问题）。
FLASHINFER_EXTRA_CUDAFLAGS = "-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK"

[feature.vllm-cuda.pypi-dependencies]
vllm = ">=0.34,<0.35"
# vllm download-kernels（vllm-cuda-prepare 预拉 flashinfer 预编译 kernel）
# 内部走 `python -m pip install`，pixi 环境默认不带 pip，须显式安装。
pip = "*"
# torch 系四件套：版本与 vLLM 的 pin 一致（0.33/0.34 均 pin torch 2.14.0 /
# torchvision 0.29.0 / torchaudio 2.11.0 / torchcodec>=0.14，故 0.34 升级
# torch 系无需变动）。
# cu130 wheel 通过 workspace 级 [pypi-options] 的 find-links 从国内镜像取
# （等价 pip --find-links），不走 index。
torch = { version = "==2.14.0+cu130" }
torchaudio = { version = "==2.11.0+cu130" }
torchvision = { version = "==0.29.0+cu130" }
torchcodec = { version = "==0.15.0+cu130" }

[feature.vllm-cuda.tasks]
# 整理 pip nvidia 包为标准 CUDA toolkit 布局（symlink 视图）。幂等。
# vllm-cuda-verify 会在缺失时自动调用；pip 包升级后需重跑。
vllm-cuda-prepare = "bash $PIXI_PROJECT_ROOT/scripts/vllm-cuda-prepare.sh"
# 安装后验证：import/CUDA 检查 + 工具链自检 + flashinfer JIT 探针。不加载大模型。
vllm-cuda-verify = "bash $PIXI_PROJECT_ROOT/scripts/vllm-cuda-verify.sh"


# ============================================================
# Feature: vLLM nightly（独立环境：Inkling-2-Mini 等新架构）
#
# 稳定版 vLLM 在 vllm-cuda 环境（0.34，在役服务用）。nightly 环境专收
# 稳定版尚未支持的架构（2026-11-26：inkling2_loop，官方 recipe 要求
# >=0.35/nightly）；0.35 正式发布并验证后，该模型迁回 vllm-cuda，
# 本环境退役。独立 solve-group，与 vllm-cuda 互不影响包解析。
#
#   pixi install -e vllm-nightly
#   pixi run   -e vllm-nightly vllm-nightly-verify
#
# vllm nightly wheel 取自 wheels.vllm.ai（PEP 503 index，per-dep index）；
# torch 系按 nightly METADATA 精确 pin 的 cu132 栈（官方构建口径），
# wheel 走 find-links 国内镜像。
# 驱动要求：CUDA 13.2 前向兼容（本机 595.58 已验证 torch/cu132 可用）。
# ============================================================
[feature.vllm-nightly]
platforms = ["linux-64-cu13"]

[feature.vllm-nightly.dependencies]
python = "3.12.*"
# gcc/gxx 钉 15：cu132 栈的 cuda_toolkit-13.2.x 元包硬 pin nvidia-cuda-nvcc
# 13.2.78，其 host_config 不支持 gcc 16（flashinfer JIT 探针实测 #error）。
# nvcc 13.2 + gcc 15.3 组合在 llamacpp-cuda 环境已验证可编译 CUDA 代码。
# （对照：vllm-cuda 环境是 cu130 栈 → nvcc 13.5.37，兼容 gcc 16，无需此 pin）
gcc_linux-64 = "15.*"
gxx_linux-64 = "15.*"

[feature.vllm-nightly.activation.env]
PATH = "$CONDA_PREFIX/vllm-nightly/bin:$PATH"
CUDA_HOME = "$CONDA_PREFIX/vllm-nightly"
CUDACXX = "$CONDA_PREFIX/vllm-nightly/bin/nvcc"
CXX = "x86_64-conda-linux-gnu-g++"
FLASHINFER_CUDA_ARCH_LIST = "12.0a"
FLASHINFER_EXTRA_CUDAFLAGS = "-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK"

[feature.vllm-nightly.pypi-dependencies]
# nightly 版本号形如 0.34.1rc1.devN+gSHA（0.34 之后的 dev 序列，
# 对应 vLLM 0.35 开发线）。wheels.vllm.ai 只保留最新一个 nightly，
# 须精确 pin；上游滚动出新 dev 或发 0.35 稳定版时改 pin 重 lock。
# 2026-11-26：dev214+g62d538c61（含 vllm/models/inkling2 完整包：
# configs / nvidia loop / renderer / speculative / tests）。
vllm = { version = "==0.34.1rc1.dev214+g62d538c61", index = "https://wheels.vllm.ai/nightly" }
pip = "*"
# torch 系四件套：nightly 官方按 cu132 构建（与平台声明 cuda=13.2 一致），
# 版本按 vllm wheel METADATA 的精确 pin（torch==2.14.0 / torchaudio==2.11.1 /
# torchvision==0.29.2 / torchcodec>=0.16）。cu132 wheel 走 find-links 国内镜像。
torch = { version = "==2.14.0+cu132" }
torchaudio = { version = "==2.11.1+cu132" }
torchvision = { version = "==0.29.2+cu132" }
torchcodec = { version = "==0.17.0+cu132" }

[feature.vllm-nightly.tasks]
# 复用 vllm-cuda 的两个脚本（prepare 的 toolkit 目录取 CUDA_HOME）
vllm-nightly-prepare = "bash $PIXI_PROJECT_ROOT/scripts/vllm-cuda-prepare.sh"
vllm-nightly-verify = "bash $PIXI_PROJECT_ROOT/scripts/vllm-cuda-verify.sh"


# ============================================================
# Feature: SGLang (PyPI, CUDA 13 后端)
#
# 与 vLLM 同样的策略：PyPI 装 sglang，torch 系从 cu130 源取。
# CUDA 运行时与编译工具链全部自包含于 torch wheel 依赖的 nvidia-*-cu13
# pip 包（site-packages/nvidia/cu13/），不依赖系统 /usr/local/cuda。
# 唯一系统依赖：NVIDIA 驱动（libcuda.so.1）。
# sglang-cuda-prepare 任务将 pip 包布局整理为标准 CUDA toolkit 目录结构
# （$CONDA_PREFIX/sglang-cuda/{bin,include,lib,lib64}），供 flashinfer
# JIT 按 CUDA_HOME 查找 nvcc、头文件与库。
#
# SGLang 0.5.23 的 pin：torch==2.14.1 / torchaudio==2.11.0 /
# torchcodec==0.17.0 / transformers==5.19.0 / sglang-kernel==0.4.10 /
# flashinfer_python[cu13]==0.7.2（cu13 extra 直接拉 CUDA 13 构建）。
# sglang-kernel 是 abi3 单 wheel（不分 CUDA 版本），依赖仅 torch==2.14.1。
# 注意：sglang 与 vllm 的 torch/torchcodec pin 不同，
#       必须各自独立 solve-group。
# ============================================================
[feature.sglang-cuda]
platforms = ["linux-64-cu13"]

[feature.sglang-cuda.dependencies]
python = "3.12.*"
# flashinfer JIT 的 host 编译器。
# nvcc 的 -ccbin 默认指向 $CUDA_HOME/bin，与 CXX 保持同一编译器。
gxx_linux-64 = ">=13"

[feature.sglang-cuda.activation.env]
# 把 nvcc 放进 PATH（sglang 自带 JIT 与 flashinfer 均按 PATH/CUDA_HOME
# 查找 nvcc）。
PATH = "$CONDA_PREFIX/sglang-cuda/bin:$PATH"
# flashinfer（get_cuda_path）的 nvcc/头文件来源。
# sglang-cuda-prepare 生成的标准 CUDA toolkit 布局。
CUDA_HOME = "$CONDA_PREFIX/sglang-cuda"
# 显式指定 nvcc 路径，不依赖 PATH 查找。
CUDACXX = "$CONDA_PREFIX/sglang-cuda/bin/nvcc"
# flashinfer 链接步骤的 C++ 编译器。conda-forge g++ 无裸名符号链接，
# 须用交叉编译全名。
CXX = "x86_64-conda-linux-gnu-g++"
# flashinfer 对 SM12.x 默认要求 CUDA>=12.9（compute_120f）。
# 显式指定 12.0a 匹配 Blackwell (SM120) 硬件。
FLASHINFER_CUDA_ARCH_LIST = "12.0a"
# PyPI 的 nvidia-cuda-nvcc (13.5) 与 nvidia-cuda-runtime (13.0) 版本独立，
# CCCL 头文件的编译器/工具链 minor 一致性检查会误报。
# 用官方 define 关闭（13.5 编译 13.0 头文件无实际兼容问题）。
FLASHINFER_EXTRA_CUDAFLAGS = "-DCCCL_DISABLE_CTK_COMPATIBILITY_CHECK"

[feature.sglang-cuda.pypi-dependencies]
sglang = ">=0.5.23,<0.6"
# torch 系四件套：版本与 SGLang 的 pin 一致（torchvision 取匹配
# torch 2.14.1 的 0.29.1；sglang 对 torchvision 无 pin）。
# cu130 wheel 通过 workspace 级 [pypi-options] 的 find-links 从国内镜像取
# （等价 pip --find-links），不走 index。
torch = { version = "==2.14.1+cu130" }
torchaudio = { version = "==2.11.0+cu130" }
torchvision = { version = "==0.29.1+cu130" }
torchcodec = { version = "==0.17.0+cu130" }

# 依赖树中存在预发布版（如 flash-attn-4 的 b 系列），必须放开 pre-release
[feature.sglang-cuda.pypi-options]
prerelease-mode = "allow"

[feature.sglang-cuda.tasks]
# 整理 pip nvidia 包为标准 CUDA toolkit 布局（symlink 视图）。幂等。
# nvcc 为 wrapper 脚本：向每次编译注入 CCCL 兼容性检查的关闭 define
# （sglang 自带 JIT 不读取 flashinfer 的 extra-flags 环境变量）。
# sglang-cuda-verify 会在缺失时自动调用；pip 包升级后需重跑。
sglang-cuda-prepare = "bash $PIXI_PROJECT_ROOT/scripts/sglang-cuda-prepare.sh"
# 安装后验证：版本 + CUDA 设备 + 工具链信息展示。不加载大模型。
sglang-cuda-verify = "bash $PIXI_PROJECT_ROOT/scripts/sglang-cuda-verify.sh"


# ============================================================
# 环境定义
# ============================================================
[environments]
llamacpp-cuda = { features = ["llama-base", "llamacpp-cuda"], solve-group = "llamacpp-cuda" }
llamacpp-vulkan = { features = ["llama-base", "llamacpp-vulkan"], solve-group = "llamacpp-vulkan" }
sdcpp-vulkan = { features = ["sdcpp-base", "sdcpp-vulkan"], solve-group = "sdcpp-vulkan" }
sdcpp-cuda = { features = ["sdcpp-base", "sdcpp-cuda"], solve-group = "sdcpp-cuda" }
strata-cuda = { features = ["strata-base", "strata-cuda"], solve-group = "strata-cuda" }
maya-cuda = { features = ["maya-base", "maya-cuda"], solve-group = "maya-cuda" }
vllm-cuda = { features = ["vllm-cuda"], solve-group = "vllm-cuda" }
vllm-nightly = { features = ["vllm-nightly"], solve-group = "vllm-nightly" }
sglang-cuda = { features = ["sglang-cuda"], solve-group = "sglang-cuda" }
