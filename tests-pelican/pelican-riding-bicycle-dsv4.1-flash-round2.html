<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · Pelican Riding a Bicycle</title>
<style>
  html, body{
    margin:0; height:100%;
    background: radial-gradient(1200px 600px at 50% 20%, #123047, #07131d 70%);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .scene{
    width:min(96vw, 1120px); height:auto; display:block;
    border-radius:18px; background:#bfe9ff;
    box-shadow:0 24px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  /* gentle up/down bob of the rider, timed to the pedal stroke */
  .rider{ animation: bob .9s ease-in-out infinite; }
  @keyframes bob{
    0%,100%{ transform: translateY(0); }
    50%    { transform: translateY(-2.5px); }
  }
  @media (prefers-reduced-motion: reduce){
    .rider{ animation: none; }
  }
</style>
</head>
<body>
<svg class="scene" viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" role="img"
     aria-label="一只鹈鹕骑着自行车向前飞驰的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#6ec1ff"/>
      <stop offset="0.5" stop-color="#a9dcff"/>
      <stop offset="1"   stop-color="#e9f7ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed46a"/>
      <stop offset="1" stop-color="#5aa63e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a5561"/>
      <stop offset="1" stop-color="#2c333c"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#fff6c9"/>
      <stop offset="0.45" stop-color="#ffe58a" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#ffe58a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3edf4"/>
    </linearGradient>
  </defs>

  <!-- ============ SKY ============ -->
  <rect x="0" y="0" width="900" height="520" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="762" cy="98" r="120" fill="url(#sunGlow)"/>
  <circle cx="762" cy="98" r="46" fill="#fff3b0"/>
  <circle cx="762" cy="98" r="46" fill="none" stroke="#ffe27a" stroke-width="3"/>

  <!-- clouds: scrolling, seamless 900px loop -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="70s" repeatCount="indefinite"/>
    <g id="cloudSet" fill="#ffffff" opacity="0.92">
      <ellipse cx="140" cy="92"  rx="46" ry="26"/>
      <ellipse cx="182" cy="80"  rx="38" ry="30"/>
      <ellipse cx="220" cy="94"  rx="34" ry="22"/>
      <ellipse cx="430" cy="142" rx="40" ry="22"/>
      <ellipse cx="466" cy="132" rx="34" ry="26"/>
      <ellipse cx="500" cy="144" rx="30" ry="20"/>
      <ellipse cx="700" cy="72"  rx="50" ry="28"/>
      <ellipse cx="746" cy="62"  rx="40" ry="32"/>
      <ellipse cx="788" cy="76"  rx="36" ry="24"/>
    </g>
    <use href="#cloudSet" xlink:href="#cloudSet" x="900"/>
  </g>

  <!-- far hills -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="34s" repeatCount="indefinite"/>
    <g id="hillsFar" fill="#a9dd8c">
      <ellipse cx="150" cy="400" rx="150" ry="88"/>
      <ellipse cx="450" cy="400" rx="150" ry="104"/>
      <ellipse cx="750" cy="400" rx="150" ry="84"/>
    </g>
    <use href="#hillsFar" xlink:href="#hillsFar" x="900"/>
  </g>

  <!-- near hills -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="18s" repeatCount="indefinite"/>
    <g id="hillsNear" fill="#74c04b">
      <ellipse cx="180" cy="402" rx="170" ry="70"/>
      <ellipse cx="560" cy="402" rx="190" ry="82"/>
      <ellipse cx="820" cy="402" rx="90"  ry="58"/>
    </g>
    <use href="#hillsNear" xlink:href="#hillsNear" x="900"/>
  </g>

  <!-- grass band -->
  <rect x="0" y="386" width="900" height="34" fill="url(#grass)"/>

  <!-- grass tufts: fast foreground scroll -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      from="0 0" to="-900 0" dur="5s" repeatCount="indefinite"/>
    <g id="tuftSet" stroke="#3f8f2e" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M60 400 l0 -13 M64 400 l4 -11 M56 400 l-5 -10"/>
      <path d="M180 399 l0 -11 M184 399 l4 -9 M176 399 l-4 -9"/>
      <path d="M320 400 l0 -14 M324 400 l5 -11 M316 400 l-5 -10"/>
      <path d="M470 399 l0 -10 M474 399 l4 -9 M466 399 l-4 -8"/>
      <path d="M610 400 l0 -13 M614 400 l4 -11 M606 400 l-5 -10"/>
      <path d="M760 399 l0 -12 M764 399 l4 -10 M756 399 l-4 -9"/>
      <path d="M860 400 l0 -14 M864 400 l5 -11 M856 400 l-5 -10"/>
    </g>
    <use href="#tuftSet" xlink:href="#tuftSet" x="900"/>
  </g>

  <!-- ============ ROAD ============ -->
  <rect x="0" y="420" width="900" height="100" fill="url(#road)"/>
  <rect x="0" y="420" width="900" height="4" fill="#5c6875"/>
  <line x1="0" y1="472" x2="900" y2="472" stroke="#ffd75e" stroke-width="6"
        stroke-dasharray="46 54" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-100"
      dur="0.55s" repeatCount="indefinite"/>
  </line>

  <!-- soft shadow under the bike -->
  <ellipse cx="430" cy="421" rx="185" ry="13" fill="#000" opacity="0.20"/>

  <!-- ============ WHEELS ============ -->
  <!-- rear wheel -->
  <g transform="translate(300,358)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
      <circle r="57" fill="none" stroke="#1f2933" stroke-width="10"/>
      <circle r="54" fill="none" stroke="#3b4854" stroke-width="3"/>
      <g stroke="#c3ced6" stroke-width="2.4">
        <line x1="-50" y1="0"    x2="50"  y2="0"/>
        <line x1="-43.3" y1="-25" x2="43.3" y2="25"/>
        <line x1="-25" y1="-43.3" x2="25"  y2="43.3"/>
        <line x1="0"   y1="-50"  x2="0"   y2="50"/>
        <line x1="25"  y1="-43.3" x2="-25" y2="43.3"/>
        <line x1="43.3" y1="-25" x2="-43.3" y2="25"/>
      </g>
      <circle r="8" fill="#1f2933"/>
      <circle r="3" fill="#8794a1"/>
    </g>
  </g>

  <!-- front wheel -->
  <g transform="translate(560,358)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="0.55s" repeatCount="indefinite"/>
      <circle r="57" fill="none" stroke="#1f2933" stroke-width="10"/>
      <circle r="54" fill="none" stroke="#3b4854" stroke-width="3"/>
      <g stroke="#c3ced6" stroke-width="2.4">
        <line x1="-50" y1="0"    x2="50"  y2="0"/>
        <line x1="-43.3" y1="-25" x2="43.3" y2="25"/>
        <line x1="-25" y1="-43.3" x2="25"  y2="43.3"/>
        <line x1="0"   y1="-50"  x2="0"   y2="50"/>
        <line x1="25"  y1="-43.3" x2="-25" y2="43.3"/>
        <line x1="43.3" y1="-25" x2="-43.3" y2="25"/>
      </g>
      <circle r="8" fill="#1f2933"/>
      <circle r="3" fill="#8794a1"/>
    </g>
  </g>

  <!-- ============ FAR (back) LEG + CRANK, behind the frame ============ -->
  <line id="crankBack" x1="430" y1="358" x2="400" y2="358"
        stroke="#6b7278" stroke-width="6" stroke-linecap="round"/>
  <g id="pedalBack" transform="translate(400,358)">
    <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
  </g>
  <line id="thighBack" x1="398" y1="289" x2="398" y2="330"
        stroke="#d0841f" stroke-width="9" stroke-linecap="round"/>
  <line id="shinBack" x1="398" y1="330" x2="402" y2="356"
        stroke="#d0841f" stroke-width="8" stroke-linecap="round"/>
  <g id="footBack" transform="translate(402,352)">
    <path d="M-12 3 Q0 -7 13 2 Q1 8 -12 3 Z" fill="#d0841f" stroke="#b06f16" stroke-width="1.5"/>
  </g>

  <!-- ============ FRAME ============ -->
  <g stroke="#0f7d76" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="300" y1="358" x2="382" y2="288"/>
    <line x1="300" y1="358" x2="430" y2="358"/>
    <line x1="430" y1="358" x2="382" y2="288"/>
    <line x1="430" y1="358" x2="584" y2="284"/>
    <line x1="382" y1="288" x2="578" y2="250"/>
  </g>
  <!-- head tube -->
  <line x1="578" y1="250" x2="584" y2="284" stroke="#0b5f59" stroke-width="13" stroke-linecap="round"/>
  <!-- fork -->
  <line x1="584" y1="284" x2="560" y2="358" stroke="#0f7d76" stroke-width="7" stroke-linecap="round"/>
  <!-- handlebar -->
  <g stroke="#0f7d76" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="578" y1="250" x2="600" y2="236"/>
    <line x1="588" y1="230" x2="620" y2="244"/>
  </g>
  <circle cx="620" cy="244" r="5.5" fill="#2b2b2b"/>
  <!-- chainring + chain -->
  <circle cx="430" cy="358" r="17" fill="none" stroke="#c9a227" stroke-width="5"/>
  <circle cx="300" cy="358" r="9" fill="#c9a227"/>
  <path d="M430 341 L300 350 M430 375 L300 366" stroke="#4a4a4a" stroke-width="3" fill="none"/>
  <!-- saddle -->
  <path d="M356 282 q24 -12 48 -1 q-7 14 -24 14 q-17 0 -24 -13 z" fill="#2b2b2b"/>

  <!-- ============ NEAR (front) LEG + CRANK, in front of the frame ============ -->
  <line id="crankFront" x1="430" y1="358" x2="460" y2="358"
        stroke="#8b939a" stroke-width="6" stroke-linecap="round"/>
  <line id="thighFront" x1="404" y1="286" x2="404" y2="330"
        stroke="#ef9a2e" stroke-width="10" stroke-linecap="round"/>
  <line id="shinFront" x1="404" y1="330" x2="432" y2="352"
        stroke="#ef9a2e" stroke-width="9" stroke-linecap="round"/>
  <g id="pedalFront" transform="translate(460,358)">
    <rect x="-10" y="-3" width="20" height="6" rx="2" fill="#222"/>
  </g>
  <g id="footFront" transform="translate(432,352)">
    <path d="M-13 3 Q0 -8 14 2 Q1 9 -13 3 Z" fill="#ef9a2e" stroke="#cc7f1c" stroke-width="1.6"/>
  </g>

  <!-- ============ PELICAN RIDER ============ -->
  <g class="rider">
    <!-- tail -->
    <path d="M352 244 C 322 232 298 234 288 246 C 304 250 306 254 298 264
             C 320 264 342 268 356 272 Z"
          fill="#ffffff" stroke="#cfdae2" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- far wing (flapping) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 356 240; -7 356 240; 0 356 240; 5 356 240; 0 356 240"
        dur="1.8s" repeatCount="indefinite"/>
      <path d="M372 250 C 338 236 300 244 292 264 C 312 262 336 264 356 272
               C 366 272 374 264 376 256 Z"
            fill="#eef4f8" stroke="#cfdae2" stroke-width="2.5" stroke-linejoin="round"/>
    </g>

    <!-- body -->
    <ellipse cx="392" cy="246" rx="53" ry="40" fill="url(#bodyShade)"
             stroke="#cfdae2" stroke-width="3"/>
    <!-- breast shading -->
    <path d="M420 264 q22 -8 24 -30" stroke="#dbe6ee" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- neck -->
    <path d="M414 228 C 444 202 476 176 504 162"
          stroke="#ffffff" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M414 228 C 444 202 476 176 504 162"
          stroke="#dbe6ee" stroke-width="30" fill="none" stroke-linecap="round"
          opacity="0.35" stroke-dasharray="2 24"/>

    <!-- head -->
    <circle cx="507" cy="150" r="25" fill="#ffffff" stroke="#cfdae2" stroke-width="3"/>

    <!-- beak: pouch + upper mandible -->
    <path d="M524 146 Q574 212 648 152 Q586 170 524 148 Z"
          fill="#f8c469" stroke="#d9822a" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M523 137 Q598 137 650 150 Q598 153 523 151 Z"
          fill="#f4a63e" stroke="#d9822a" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="649" cy="150" r="2.6" fill="#c46a18"/>

    <!-- eye -->
    <circle cx="511" cy="141" r="5" fill="#14202b"/>
    <circle cx="509.2" cy="139" r="1.8" fill="#ffffff"/>

    <!-- near wing reaching the handlebar -->
    <path d="M420 224 C 470 208 540 220 610 240"
          stroke="#ffffff" stroke-width="23" fill="none" stroke-linecap="round"/>
    <path d="M420 224 C 470 208 540 220 610 240"
          stroke="#e2ebf1" stroke-width="23" fill="none" stroke-linecap="round"
          opacity="0.35" stroke-dasharray="3 26"/>
    <ellipse cx="612" cy="241" rx="14" ry="11" fill="#ffffff" stroke="#cfdae2" stroke-width="2.5"/>
    <!-- folded wing feathers on the body -->
    <path d="M404 236 C 372 228 340 240 334 262 C 352 252 376 250 398 252"
          fill="#f4f8fb" stroke="#cfdae2" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M392 254 q-16 3 -30 12 M398 264 q-14 3 -26 11"
          stroke="#d5e0e8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- motion streaks -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="150" y1="300" x2="210" y2="300">
      <animate attributeName="x1" values="150;90;90" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="210;150;150" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="330" x2="220" y2="330">
      <animate attributeName="x1" values="170;120;120" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="220;170;170" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>

<script>
(function () {
  "use strict";

  // ---- rig geometry (SVG user units) ----
  var BB = { x: 430, y: 358 };      // bottom bracket (crank center)
  var R = 30;                        // crank radius
  var L1 = 57, L2 = 57;              // thigh / shin length
  var hipFront = { x: 404, y: 286 };
  var hipBack  = { x: 398, y: 289 };
  var PEDAL_PERIOD = 0.9;            // seconds per revolution

  var $ = function (id) { return document.getElementById(id); };
  var crankFront = $("crankFront"), crankBack = $("crankBack");
  var pedalFront = $("pedalFront"), pedalBack = $("pedalBack");
  var thighFront = $("thighFront"), shinFront = $("shinFront"), footFront = $("footFront");
  var thighBack  = $("thighBack"),  shinBack  = $("shinBack"),  footBack  = $("footBack");

  // Two-bone inverse kinematics: place the knee so the leg reaches the foot.
  function solveKnee(hip, foot, l1, l2) {
    var dx = foot.x - hip.x, dy = foot.y - hip.y;
    var d0 = Math.hypot(dx, dy) || 0.0001;
    var d = Math.min(Math.max(d0, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.5);
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / d0, uy = dy / d0;
    var px = uy, py = -ux;          // knee bends forward/up, like a cyclist
    return { x: hip.x + a * ux + h * px, y: hip.y + a * uy + h * py };
  }

  function updateLeg(thigh, shin, footEl, hip, foot) {
    var knee = solveKnee(hip, foot, L1, L2);
    thigh.setAttribute("x1", hip.x);  thigh.setAttribute("y1", hip.y);
    thigh.setAttribute("x2", knee.x); thigh.setAttribute("y2", knee.y);
    shin.setAttribute("x1", knee.x);  shin.setAttribute("y1", knee.y);
    shin.setAttribute("x2", foot.x);  shin.setAttribute("y2", foot.y);
    footEl.setAttribute("transform", "translate(" + foot.x + "," + foot.y + ")");
  }

  var t0 = null;
  function loop(now) {
    if (t0 === null) { t0 = now; }
    var t = (now - t0) / 1000;
    var theta = t * (2 * Math.PI / PEDAL_PERIOD);

    var pR = { x: BB.x + R * Math.cos(theta),          y: BB.y + R * Math.sin(theta) };
    var pL = { x: BB.x + R * Math.cos(theta + Math.PI), y: BB.y + R * Math.sin(theta + Math.PI) };

    // crank arms
    crankFront.setAttribute("x2", pR.x); crankFront.setAttribute("y2", pR.y);
    crankBack.setAttribute("x2", pL.x);  crankBack.setAttribute("y2", pL.y);

    // pedals stay level
    pedalFront.setAttribute("transform", "translate(" + pR.x + "," + pR.y + ")");
    pedalBack.setAttribute("transform", "translate(" + pL.x + "," + pL.y + ")");

    // feet rest just on top of the pedals
    var footR = { x: pR.x + 2, y: pR.y - 6 };
    var footL = { x: pL.x + 2, y: pL.y - 6 };

    updateLeg(thighFront, shinFront, footFront, hipFront, footR);
    updateLeg(thighBack,  shinBack,  footBack,  hipBack,  footL);

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
