# add this modeline for validation in vscode
# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# llama-swap YAML configuration example
# -------------------------------------
#
# 💡 Tip - Use an LLM with this file!
# ====================================
#  This example configuration is written to be LLM friendly. Try
#  copying this file into an LLM and asking it to explain or generate
#  sections for you.
# ====================================

# Usage notes:
# - Below are all the available configuration options for llama-swap.
# - Settings noted as "required" must be in your configuration file
# - Settings noted as "optional" can be omitted

# healthCheckTimeout: number of seconds to wait for a model to be ready to serve requests
# - optional, default: 120
# - minimum value is 15 seconds, anything less will be set to this value
healthCheckTimeout: 3600  # 60min（sglang Flash NVFP4 单卡冷加载实测 ~40min；vLLM ~18min）

# logLevel: sets the logging value
# - optional, default: info
# - Valid log levels: debug, info, warn, error
logLevel: debug

# logTimeFormat: enables and sets the logging timestamp format
# - optional, default (disabled): ""
# - Valid values: "", "ansic", "unixdate", "rubydate", "rfc822", "rfc822z",
#   "rfc850", "rfc1123", "rfc1123z", "rfc3339", "rfc3339nano", "kitchen",
#   "stamp", "stampmilli", "stampmicro", and "stampnano".
# - For more info, read: https://pkg.go.dev/time#pkg-constants
logTimeFormat: "stamp"

# logToStdout: controls which log streams are written to stdout
# - optional, default: "proxy"
# - a comma separated list of one or more streams, e.g. "proxy,http":
#   - "proxy": logs generated by llama-swap when swapping models,
#      handling requests, etc.
#   - "upstream": a copy of an upstream processes stdout logs
#   - "http": one access log line per HTTP request
# - or one of these values:
#   - "both": every stream (proxy, upstream and http) interleaved together
#   - "none": no logs are ever written to stdout
# - HTTP access lines used to be part of the proxy logs. Use "proxy,http" to
#   keep printing them to stdout.
logToStdout: "both"

# store: persistent storage for activity metrics state
# - optional, default: in-memory sqlite database capped by metricsMaxInMemory
# - path is a sqlite database file path
# - file-backed sqlite keeps activity logs across restarts
store:
  path: ${env.HOME}/local-llama/activity-PRO6000.sqlite

# metricsMaxInMemory: maximum number of metrics to keep in memory
# - optional, default: 1000
# - controls how many metrics are stored in memory before older ones are discarded
# - useful for limiting memory usage when processing large volumes of metrics
# - when persistent sqlite storage is defined in store.path this has no effect
metricsMaxInMemory: 1000

# captureBuffer: how many MBs to allocate for storing request/response captures
# - optional, default: 10
# - set to 0 to disable
captureBuffer: 15

# ui.activity.session_id: ordered request headers used to identify sessions in
# the Activity page's in-flight request table.
# - optional, default: ["X-Session-ID", "X-Litellm-Session-Id"]
# - matching is case-insensitive; the first non-empty matching header is shown
# - set to [] to disable session ID lookup
ui:
  activity:
    session_id: ["X-Session-ID", "X-Litellm-Session-Id"]

# performance: configuration for system monitoring statistics
# - timing values are duration strings like 1s, 1h30m, 90m, 2h10s, etc.
performance:
  # disabled: boolean
  # - default: false
  disabled: false

  # every: delay between polling for new performance statistics
  # - default: 5s
  # - minimum duration 5s
  every: 5s

# startPort: sets the starting port number for the automatic ${PORT} macro.
# - optional, default: 5800
# - the ${PORT} macro can be used in model.cmd and model.proxy settings
# - it is automatically incremented for every model that uses it
startPort: 16000

# sendLoadingState: inject loading status updates into the reasoning (thinking)
# field
# - optional, default: false
# - when true, a stream of loading messages will be sent to the client in the
#   reasoning field so chat UIs can show that loading is in progress.
# - see #366 for more details
sendLoadingState: true

# includeAliasesInList: present aliases within the /v1/models OpenAI API listing
# - optional, default: false
# - when true, model aliases will be output to the API model listing duplicating
#   all fields except for Id so chat UIs can use the alias equivalent to the original.
#   列出变体, like :XXXX
includeAliasesInList: true

# globalTTL: the default TTL in seconds before unloading a model
# - optional, default: 0 (never automatically unload)
# - must be >= 0
globalTTL: 3600

# unloadTimeout: graceful timeout in seconds when unloading a model (manual, API, or ttl expiry)
# - optional, default: 10
# - used before force-killing the model process on unload
# - can be overridden per model with model.unloadTimeout
# - large values extend how long an unload can take when a process does not exit cleanly
unloadTimeout: 10

# globalConcurrencyLimit: caps the number of inference requests served at once
# across all models combined
# - optional, default: 0 (no limit)
# - unlike models.*.concurrencyLimit, this is a single semaphore shared by
#   every model rather than a per-model limit
# - requests that exceed the limit receive an HTTP 429 Too Many Requests
#   response immediately, rather than being queued
# - see issue #1086
globalConcurrencyLimit: 0

# macros: a dictionary of string substitutions
# - optional, default: empty dictionary
# - macros are reusable snippets
# - global macros can be used in any configuration value
# - model macros can be used in any value within that model
# - useful for reducing common configuration settings
# - macro names are strings and must be less than 64 characters
# - macro names must match the regex ^[a-zA-Z0-9_-]+$
# - macro names must not be a reserved name: PID, PORT, or MODEL_ID
# - macro values can be numbers, bools, or strings
# - macros can contain other macros, but they must be defined before they are used
# - environment variables can be referenced with ${env.VAR_NAME} syntax
#   - env macros are substituted first, before regular macros
#   - if the env var is not set, config loading will fail with an error
# - ${PORT} is assigned while loading each model that uses it in cmd
# - ${PID} is substituted when a model's cmdStop runs
macros:
  # multi-line macro
  # 参数测试：
  #  * --n-gpu-layers, -ngl 9, 内存占用一半，输出 ～1 token/s
  #  * -ngl 99, 内存占用等同模型体积，输出 ～10 t/s
  #  * --device none, 不用GPU，内存占用约模型体积一半，输出 11 t/s
  #  * --load-mode auto（默认）。
  #    mmap 内存映射加载模型，启动快内存占用低。
  #    mlock 锁定模型占用的内存，禁止交换/压缩，推理延迟更稳定。
  #  * --no-mmproj-offload, 强制 mmproj 模型在 CPU 上运行，避免程序显存不足崩溃。
  #  * --flash-attn, Flash Attention,
  #    优化的注意力计算内核，通过分块（tiling）和重计算（recomputation）减少
  #    对高带宽内存（HBM）的读写次数，加速推理并减少显存占用，在处理长序列时效果显著
  #  * --fit, 若可用内存不足，自动牺牲上下文窗口长度（--ctx-size）
  #    建议关闭，以保证可预测的行为和服务质量
  #  * --cache-type-k(v), KV 缓存的数据类型，默认 f16，改为 q8_0 内存占用减半。
  #    Key 缓存可能比 Value 缓存对量化更敏感，非对称 KV 缓存量化可工作，
  #    但 MoE 模型对此敏感，除非内存很紧张，否则尽量不要用。
  #  * --kv-unified：启用统一 KV 缓存，对于并行、多用户请求，可减少内存碎片和分配开销
  #  * --cache-ram N, 存储“Prompt 缓存”的内存大小(MiB)，与 KV 缓存在概念上相似，都为了避免重复计算
  #  * -t, --threads, CPU 推理线程数，默认 -1
  #  * -np, --parallel, 并行解码序列数，默认 1，一个 prompt 生成多个候选回答
  #  * -n, --predict, --n-predict, 预测的 token 数量上限，默认 -1 无限
  #  * -b, --batch-size N, 控制 prompt 处理（prefill）阶段一次送入模型的最大 token 数量
  #    默认 2048，增大可提高 prefill 并行度，加速长 prompt 的处理，但会占用更多中间激活内存。
  #  * --offline, 强制离线模式，禁止所有网络访问，避免联网而卡住或超时
  #  * --split-mode layer, 模型的不同层分配到不同GPU上，而 tensor 对 GPU 通信要求高
  #    举例，--device CUDA0,CUDA1 --split-mode layer
  #    https://github.com/ggml-org/llama.cpp/blob/master/docs/multi-gpu.md
  #  * --list-devices, 列出设备，仅选择一个 PRO6000
  #    CUDA_VISIBLE_DEVICES=7, 环境变量控制可见卡，防止 CLIP 用到 CUDA0。
  #    每个模型可将 CUDA? 映射为 CUDA0。
  "default-llama": >
    pixi run -m ${env.HOME}/local-llama -e llamacpp-cuda llama-server
    --port ${PORT}
    --n-gpu-layers all --device CUDA0
    --mmproj-offload
    --load-mode auto --flash-attn on --fit off
    --cache-type-k f16 --cache-type-v f16
    --kv-unified
    --ubatch-size 4096

  # vLLM（pixi 环境 vllm-cuda，PyPI + torch cu130，见 docs/pixi-environments.md）
  # 参数测试：
  #  * --enable-per-request-metrics：启用后，vLLM 响应中会包含usage、metrics 对象
  #    这些信息可用于 llama-swap  计算解码速率等。
  #  * --per-request-spec-decode-metrics：在 API 响应里返回请求的投机解码统计信息
  #  * --max-num-seqs：设置引擎最大并发处理序列数，多余的请求会在等待池中排队
  #  * --tensor-parallel-size：指定张量并行大小，即模型在多少个GPU上进行切分并行计算。
  #    1 表示不使用张量并行，模型在单个GPU上运行
  #  * --kv-cache-dtype fp8：设置 KV缓存的数据类型为 fp8
  #  * --enable-prefix-caching：复用已计算好的 KV cache，跳过重复 prefill，默认启用
  #  * --prefix-match-unit：prefill 缓存键的最细 token 边界。
  #    越小，前缀匹配越精细，缓存命中率越高，但元数据开销越大。
  #    前缀缓存对 Mamba 混合模型的行为边界（Qwen3.8-27B）见 docs/vllm.md。
  "default-vllm": >
    pixi run -m ${env.HOME}/local-llama -e vllm-cuda vllm serve
    --host 127.0.0.1 --port ${PORT}
    --enable-per-request-metrics
    --enable-prompt-tokens-details
    --per-request-spec-decode-metrics summary
    --max-num-seqs 8
    --tensor-parallel-size 1
    --kv-cache-dtype fp8
    --enable-prefix-caching
    --prefix-match-unit 64

  # SGLang（pixi 环境 sglang-cuda，PyPI + torch cu130，见 docs/pixi-environments.md）
  # 参数测试：
  #  * --enable-metrics：Prometheus /metrics 端点（进程级指标）
  #  * --enable-cache-report：在 OpenAI 响应的 usage.prompt_tokens_details
  #    返回 cached_tokens，供 llama-swap 统计 Cached 列
  "default-sglang": >
    pixi run -m ${env.HOME}/local-llama -e sglang-cuda sglang serve
    --host 127.0.0.1 --port ${PORT}
    --enable-metrics
    --enable-cache-report

  # Example of environment variable macros
  # - ${env.VAR_NAME} pulls the value from the system environment
  # - useful for paths, secrets, or machine-specific configuration
  "models_dir": /data/huggingface-downloads

  # context size
  "ctx_64k": 65536
  "ctx_128k": 131072
  "ctx_256k": 262144

# apiKeys: require an API key when making requests to inference endpoints
# - optional, default: []
# - when empty (the default) authorization will not be checked as llama-swap is default-allow
# - each key is a non-empty string
apiKeys:
  # tip, one liner: printf "sk-%s\n" "$(head -c 48 /dev/urandom | base64 )"
  - "sk-uDWLwp0dJlXov/qQvhPHvzLL/e2EZOvX5AC+2LPvBaznUmvQomgSUIM9sNd1e7dT"
  - "sk-bgbK/waTWNXZlaoo+NZtDTiFvMg+dJjpQGklYPUyQCNyx0jO9/sBz2KPT+x+TXHv"
  - "sk-Ge6iugYDvwnrUcxzKxHKxpTQG0fG6mgN0XLdVHF/rm8byNbfwVhoub/ST5kseUcP"

  # use environment variable macros to keep secrets out of the config
  #- "${env.API_KEY_1}"
  #- "${env.API_KEY_2}"

# security: settings that control who may talk to llama-swap
# - optional, omit the whole block to allow any origin (the legacy default)
# - llama-swap only sends Access-Control-* headers when the request carries an
#   Origin header, so curl, litellm and other non-browser clients get none
# - any CORS headers an upstream (llama-server, vLLM) sets are stripped from
#   proxied responses so exactly one set reaches the client, see issue #85
security:
  # cors: allowedOrigins is what switches modes
  # - leave allowedOrigins out to keep the permissive default
  # - set it to take charge of access; nothing then falls back to allow-all
  # - the other settings only describe preflight mechanics, so each one you
  #   leave out still takes its default and naming only origins keeps working
  cors:
    # allowedOrigins: browser origins allowed to read responses
    # - omit the key to allow any origin; an empty list [] is an error
    # - REQUIRED once any other cors setting is set
    # - each entry is a bare scheme://host[:port], no trailing slash or path
    # - "*" allows any origin, and cannot be combined with allowCredentials
    allowedOrigins:
      - "*"

    # allowCredentials: let browsers send cookies and Authorization headers
    # - optional, default: false
    # - requires allowedOrigins to list origins explicitly
    allowCredentials: false

    # allowPrivateNetwork: answer Chrome's Private Network Access preflight,
    #   so a page on a public origin may reach llama-swap on a LAN address
    # - optional, default: false
    # - requires allowedOrigins to list origins explicitly, not "*"
    # - only sent on a preflight that asked for it
    allowPrivateNetwork: false

    # allowedMethods: methods advertised on preflight (OPTIONS) responses
    # - optional, default: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
    allowedMethods:
      - "GET"
      - "POST"
      - "PUT"
      - "PATCH"
      - "DELETE"
      - "OPTIONS"

    # allowedHeaders: request headers advertised on preflight responses
    # - optional, default: [] which echoes the client's
    #   Access-Control-Request-Headers, falling back to
    #   [Content-Type, Authorization, Accept, X-Requested-With]
    allowedHeaders: []

    # exposedHeaders: response headers a browser may read beyond the
    #   CORS-safelisted set
    # - optional, default: [] which omits the header
    exposedHeaders: []

    # maxAge: how long in seconds a browser may cache a preflight response
    # - optional, default: 86400
    maxAge: 86400

# upstream: controls behaviour of the /upstream passthrough endpoint
# - optional, default: empty dictionary
# - recommended to only use in special use cases. Leaving it as the
#   default will typically be the best experience
upstream:
  # ignorePaths: list of RE2 compatible regular expressions
  # - default: (see below)
  # - any request to a path matching any of the regular expressions
  #   will be ignored and not trigger a swap
  ignorePaths:
    - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt)$'

    # ComfyUI specific: ignore /ws and /api/jobs to prevent swaps
    # when the UI is open
    - ^\/ws$|^\/api\/jobs$

# models: a dictionary of model configurations
# - required
# - each key is the model's ID, used in API requests
# - model settings have default values that are used if they are not defined here
# - the model's ID is available in the ${MODEL_ID} macro, also available in macros defined above
# - below are examples of the all the settings a model can have
models:
  # keys are the model names used in API requests
  # 1. q27b
  "Qwen3.8-27B":
    # cmd: the command to run to start the inference server.
    # - required
    # - it is just a string, similar to what you would run on the CLI
    # - using `|` allows for comments in the command, these will be parsed out
    # - macros can be used within cmd
    # - 参数测试：
    #   * --reasoning, 是否开启思考模式，auto 则根据 template 确定。
    #     代替老版本参数 --chat-template-kwargs '{"enable_thinking":true/false}'。
    #     模板 --chat-template deepseek3/chatml 等，默认为模型的 metadata。
    #     模板 --jinja 默认开启。
    #   * --reasoning-budget, 限制思考阶段可用 token 数，可用于防止思考循环。
    #     默认 -1 无限制；0 立即结束，无思考，模型输出空思考内容，浪费一次前向；
    #     简单问答 400-1000；复杂推理（代码、数学）1000-4000；复杂逻辑/大文档 4000+。
    #     若预算耗尽，可用 --reasoning-budget-message 在思考结束标记之前注入消息。
    #   * --reasoning-format, none/deepseek, 思考内容放在哪返回
    #   * --spec-type, 默认 none, 投机解码策略，如多 token 预测（Multi-Token Prediction）
    #   * --spec-draft-n-max, 草稿阶段的最大 token 长度
    #     see: https://github.com/ggml-org/llama.cpp/pull/22673#issuecomment-4375891776
    cmd: |
      ${default-llama}
      --model ${models_dir}/Qwen3.8-27B/Qwen3.8-27B-UD-Q8_K_XL.gguf
      --mmproj ${models_dir}/Qwen3.8-27B/mmproj-BF16.gguf
      --ctx-size ${ctx_256k}
      --cache-ram 12288
      --jinja --chat-template-file ${models_dir}/Qwen-chat-templates/peculiar-ragdoll-v22.5.0.jinja
      --reasoning on --reasoning-format deepseek
      --spec-type draft-mtp --spec-draft-n-max 3
    env:
      - "CUDA_VISIBLE_DEVICES=2"

    # description: a description for the model
    # - optional, default: empty string
    # - if set, it will be used in the v1/models API response
    # - if not set, it will be omitted in the JSON model record
    description: "Dense model (27B) from Aliyun Qwen (Thinking)"

    # aliases: alternative model names that this model configuration is used for
    # - optional, default: empty array
    # - aliases must be unique globally
    # - useful for impersonating a specific model
    aliases:
      # - "Qwen3.6-27B"  # 保留旧模型名称，历史统计原地保留

    # metadata: a dictionary of arbitrary values that are included in /v1/models
    # - optional, default: empty dictionary
    # - while metadata can contains complex types it is recommended to keep it simple
    # - metadata is only passed through in /v1/models responses
    metadata:
      # port will remain an integer
      port: ${PORT}
      note: "The ${MODEL_ID} is running on port ${PORT}, context=${ctx_256k}"

    # ttl: automatically unload the model after ttl seconds
    # - optional, default: -1 (use global default)
    # - ttl values must be a value greater than or equal to 0
    # - a ttl of -1 will use the global TTL value as the default
    # - a ttl of 0 will mean never unload
    # - a value of 0 disables automatic unloading of the model
    ttl: 36000 # 10h

    # filters: a dictionary of filter settings
    # - optional, default: empty dictionary
    # - same capabilities as peer filters (stripParams, setParams)
    filters:
      # setParamsByID: a dictionary of parameters to set based the model ID
      # - optional, default: empty dictionary
      # - combine with aliases to create variant behaviour without reloading the model
      # - parameters are set in the request body JSON
      # - run after setParams so it will override any settings
      # - protected params like "model" cannot be overridden
      # - values can be strings, numbers, booleans, arrays, or objects
      # - model aliases will be automatically created for each key
      # 参考: https://huggingface.co/unsloth/Qwen3.6-35B-A3B-GGUF#best-practices
      setParamsByID:
        # 变体 1：通用(编码)任务（默认）
        "${MODEL_ID}":
          temperature: 1.0
          top-p: 0.95 # 核采样，从概率最高的词开始累加概率，直到累积概率达到 top_p
          top-k: 20   # 只从概率最高的 k 个词中采样
          min-p: 0.0  # 保留所有概率 ≥ min_p * max_prob 的 token
          reasoning-budget: 8192  # 限制思考阶段可用 token 数
          chat-template-kwargs:
            preserve_thinking: true  # 保留思考过程
            reasoning_effort: "medium"  # low, medium, xhigh
          # 防止循环 endless
          presence-penalty: 0.1  # 惩罚已出现的词, [0.0(禁用), 2.0(惩罚, Qwen3.6后，会破坏code语法)]
          repeat-penalty: 1.1    # 根据词出现的次数进行惩罚, [1.0(不惩罚), 1.5]
        # 变体 2：简单任务
        "${MODEL_ID}:low":
          temperature: 0.9
          top-p: 0.95
          top-k: 20
          min-p: 0.0
          reasoning-budget: 4096    # 减少思考
          chat-template-kwargs:
            preserve_thinking: true  # 保留思考过程
            reasoning_effort: "low"
          # 防止循环 endless
          presence-penalty: 0.1  # 惩罚已出现的词, [0.0(禁用), 2.0(惩罚)]
          repeat-penalty: 1.1    # 根据词出现的次数进行惩罚, [1.0(不惩罚), 1.5]

    # sendLoadingState: overrides the global sendLoadingState setting for this model
    # - optional, default: undefined (use global setting)
    sendLoadingState: true

    # timeouts: configure proxy connection timeouts for this model
    # - optional, defaults shown below
    # - useful for models running on slower hardware that need longer timeouts
    # - connect: TCP dial connection timeout in seconds, default: 30 seconds
    # - keepalive: TCP connection keepalive timeout, default: 30 seconds
    # - responseHeader: time to wait for response headers in seconds, default: 0 (no timeout)
    # - tlsHandshake: TLS handshake timeout in seconds, default: 10 seconds
    # - idleConn: idle connection timeout in seconds, default: 90 seconds
    # - set any value to 0 to disable that timeout (not recommended)
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600 # 10min 模型处理图片（多模态）时，需等待较长时间
      tlsHandshake: 10
      idleConn: 90

    # capabilities: defines what the model accepts for input, output and other metadata
    # - optional; omitted or all-zero means no capabilities
    # - used in v1/models to inform clients what the model can do
    capabilities:
      # in: list of modalities understood by the model
      # - default: []
      # - valid: text, audio, image
      in: [text, image]

      # out: list of modalities generated by the model
      # - default: []
      # - valid: text, audio, image
      out: [text]

      # tools: the model supports function calling
      # - default: false
      tools: true

      # reranker: the model supports the /v1/rerank endpoint
      # - default: false
      reranker: false

      # context: the maximum token context length supported
      # - default: 0
      # - must be an integer > 0
      context: 262144

  # 2. q38fn
  # N-gram offloaded to RAM (mmap), TODO MTP enabled
  "Qwen3.8-Flash-Next":
    cmd: |
      pixi run -m ${env.HOME}/local-llama -e llamacpp-cuda llama-server
      --model ${models_dir}/Qwen3.8-Flash-Next/UD-IQ4_XS/Qwen3.8-Flash-Next-UD-IQ4_XS-00001-of-00003.gguf
      --mmproj ${models_dir}/Qwen3.8-Flash-Next/mmproj-F16.gguf
      --port ${PORT}
      --n-gpu-layers all --device CUDA0
      --n-cpu-moe 0
      --mmproj-offload
      --load-mode mmap+mlock --flash-attn on --fit off
      --cache-type-k q8_0 --cache-type-v q8_0
      --kv-unified
      --ubatch-size 4096
      --cache-ram 12288
      --ctx-size ${ctx_256k}
      --jinja --chat-template-file ${models_dir}/Qwen-chat-templates/froggeric-v22.5.jinja
      --reasoning on --reasoning-format deepseek
    # MTP wait PR #28243
    #  --model-draft ${models_dir}/Qwen3.8-Flash-Next/MTP/mtp-Qwen3.8-Flash-Next-Q8_0.gguf
    #  --spec-type draft-mtp --spec-draft-n-max 2
    env:
      - "CUDA_VISIBLE_DEVICES=5"
    description: "MoE model (125B/6B active) from Aliyun Qwen"
    aliases:
      # - "Qwen3.8-Flash-Next"  # 保留旧模型名称，历史统计原地保留
    metadata:
      port: ${PORT}
      note: "N-gram embedding in system RAM, full 256K context"
    ttl: 36000
    filters:
      setParamsByID:
        "${MODEL_ID}":
          temperature: 1.0
          top-p: 0.95
          top-k: 20
          min-p: 0.0
          reasoning-budget: 8192
          chat-template-kwargs:
            preserve_thinking: true  # 保留思考过程
            reasoning_effort: "medium"  # low, medium, xhigh
        "${MODEL_ID}:xhigh":
          temperature: 1.0
          top-p: 0.95
          top-k: 20
          min-p: 0.0
          chat-template-kwargs:
            preserve_thinking: true
            reasoning_effort: "xhigh"
    sendLoadingState: true
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 90
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      reranker: false
      context: 262144

  # 3. 27B vLLM 后端（FP8）
  # - 参数参考: https://recipes.vllm.ai/Qwen/Qwen3.8-27B
  # - 要点见 docs/vllm.md
  "Qwen3.8-27B-vllm":
    # vLLM 按启动路径注册模型名，须映射到该路径（llama.cpp 不校验 model 字段，无需此项）
    useModelName: "${models_dir}/Qwen3.8-27B-FP8"
    cmd: |
      ${default-vllm}
      ${models_dir}/Qwen3.8-27B-FP8
      --max-model-len ${ctx_256k}
      --reasoning-parser qwen3
      --mm-encoder-tp-mode data
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
    env:
      - "CUDA_VISIBLE_DEVICES=2"
    description: "Dense model (27B) from Aliyun Qwen, FP8, vLLM backend"
    aliases:
      # - "Qwen3.6-27B-vllm"
    metadata:
      port: ${PORT}
      note: "The ${MODEL_ID} is running on port ${PORT}, context=${ctx_256k}"
    ttl: 36000
    sendLoadingState: true
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 90
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      reranker: false
      context: 262144

  # 4. 27B SGLang 后端（FP8）
  # - 参数参考: https://docs.sglang.io/cookbook/autoregressive/Qwen/Qwen3.8
  # - 要点见 docs/sglang.md
  # 参数测试：
  #  * --trust-remote-code: 允许加载模型自带的自定义代码。对于 Qwen3 系列等
  #   包含特殊架构或处理逻辑的模型，此参数是必须的。
  #  * --attention-backend flashinfer: 指定使用 FlashInfer 作为 Attention 计算后端。
  #    FlashInfer 是专为 LLM 推理优化的高效 Attention 引擎，可提供更低的延迟。
  #  * --chunked-prefill-size 2048: 设置分块预填充（Chunked Prefill）的块大小为 2048。
  #    将长提示词切分成小块处理，可有效降低长上下文预填充时的峰值显存占用，避免 OOM。
  #  * --kv-cache-dtype fp8_e4m3: 将 KV Cache 的数据类型设置为 FP8 (E4M3 格式)，可大幅降低 KV Cache 的显存占用。
  #  * --mem-fraction-static 0.85: 指定用于静态分配（模型权重 + KV Cache）的 GPU 显存比例。
  #    0.85 表示预留 85% 的显存给模型和缓存，剩余 15% 用于运行时开销。显存不足时可适当调低此值。
  #  * --mamba-full-memory-ratio 4.59: 针对 Mamba 层缓存与 KV Cache 之间的显存分配比例。
  #    4.59 表示分配给 Mamba 缓存的显存约为 KV Cache 的 4.59 倍，这是针对 Qwen3.8-27B 混合架构的特定调优值。
  #  * --mamba-radix-cache-strategy extra_buffer: 设置 Mamba 层的 Radix Cache 策略为 extra_buffer，
  #    使用额外缓冲区来优化 Mamba 状态缓存的复用和管理。
  #  * --mamba-ssm-dtype bfloat16: 指定 Mamba SSM（状态空间模型）状态的精度。
  #    这比 bfloat16 精度更高，结果更准确，但会占用更多显存。
  #  * --reasoning-parser qwen3: 启用针对 Qwen3 模型的推理内容解析器。
  #  * --tool-call-parser qwen3_coder: 启用针对 Qwen3-Coder 系列模型的工具调用（Tool Call）解析器。
  #  * --speculative-algorithm NEXTN: 投机解码，使用 checkpoint 内置的 MTP 头
  #    （无需独立 draft 模型）。NEXTN 是 EAGLE 的别名，同一算法。
  #    官方 cookbook（Qwen3.8-27B 页）推荐组合：3 步草稿、topk 1、每轮验证 4 个
  #    候选 token（3 草稿 + 1 目标）。MTP 与 FlashInfer 搭配要求 flashinfer
  #    比 0.6.15.post1 新（prefill plan 支持 uniform_q_len），本环境 0.6.18 满足。
  #  * --mamba-track-interval（默认 256）须 ≥ speculative-num-draft-tokens，
  #    默认值满足，无需显式指定。
  "Qwen3.8-27B-sglang":
    # SGLang 按 --model-path 注册模型名，须映射到该路径
    useModelName: "${models_dir}/Qwen3.8-27B-FP8"
    cmd: |
      ${default-sglang}
      --model-path ${models_dir}/Qwen3.8-27B-FP8
      --trust-remote-code
      --attention-backend flashinfer
      --chunked-prefill-size 2048
      --kv-cache-dtype fp8_e4m3
      --mem-fraction-static 0.85
      --mamba-full-memory-ratio 4.59
      --mamba-radix-cache-strategy extra_buffer
      --mamba-ssm-dtype bfloat16
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --speculative-algorithm NEXTN
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4
    env:
      - "CUDA_VISIBLE_DEVICES=2"
    filters:
      setParams:
        # sglang 逐请求投机解码统计（响应 sglext.spec_tokens_details）；
        # 本地补丁版 llama-swap 解析入 Drafted 列（见 docs/llama-swap.md）
        return_spec_tokens_details: true
        # sglang 流式响应仅在显式 include_usage 时于末块返回 usage（OpenAI 惯例），
        # 为 Activity 页 token 数与客户端 decode 速率测量提供数据源
        stream_options:
          include_usage: true
    description: "Dense model (27B) from Aliyun Qwen, FP8, SGLang backend"
    aliases:
      # - "Qwen3.6-27B-sglang"
    metadata:
      port: ${PORT}
      note: "The ${MODEL_ID} is running on port ${PORT}, context=${ctx_256k}"
    ttl: 36000
    sendLoadingState: true
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 90
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      reranker: false
      context: 262144

  # 5. Flash NVFP4 (124G) vLLM 后端 —— 单卡 PRO6000
  # - nvidia ModelOpt 混合精度导出；51B N-gram 表（PLE）默认 offload 到 CPU，
  #   GPU 放 74G 权重；QSA 要求 BF16 主 KV、spec-decode-metrics 要求
  #   speculative-config，故不复用 default-vllm 宏。详见 docs/vllm.md
  "Qwen3.8-Flash-Next-vllm":
    # vLLM 按启动路径注册模型名，须映射到该路径
    useModelName: "${models_dir}/Qwen3.8-Flash-Next-NVFP4"
    cmd: |
      pixi run -m ${env.HOME}/local-llama -e vllm-cuda vllm serve
      ${models_dir}/Qwen3.8-Flash-Next-NVFP4
      --host 127.0.0.1 --port ${PORT}
      --quantization modelopt
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.95
      --max-model-len ${ctx_256k}
      --max-num-seqs 4
      --max-num-batched-tokens 8192
      --enable-prefix-caching
      --moe-backend marlin
      --attention-config.indexer_kv_dtype fp8
      --no-enable-flashinfer-autotune
      --enable-per-request-metrics
      --enable-prompt-tokens-details
      --per-request-spec-decode-metrics summary
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
    env:
      - "CUDA_VISIBLE_DEVICES=5"
      - "VLLM_PLE_CPU_OFFLOAD=1"
    description: "MoE model (125B/6B active) from Aliyun Qwen, NVFP4, vLLM backend"
    metadata:
      port: ${PORT}
      note: "The ${MODEL_ID} is running on port ${PORT}, context=${ctx_256k}"
    ttl: 36000
    sendLoadingState: true
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 90
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      reranker: false
      context: 262144

  # 6. Flash NVFP4 (133G) SGLang 后端
  "Qwen3.8-Flash-Next-sglang":
    # SGLang 按 --model-path 注册模型名，须映射到该路径
    # 全新环境首次加载前先跑 scripts/sglang-precompile-moe.py（见 docs/sglang.md）
    useModelName: "${models_dir}/Qwen3.8-Flash-Next-NVFP4"
    cmd: |
      ${default-sglang}
      --model-path ${models_dir}/Qwen3.8-Flash-Next-NVFP4
      --tp 1
      --fp4-gemm-backend flashinfer_cutlass
      --moe-runner-backend flashinfer_cutlass
      --page-size 64
      --mamba-track-interval 64
      --chunked-prefill-size 4096
      --context-length 262144
      --speculative-algorithm NEXTN
      --speculative-num-steps 3
      --speculative-eagle-topk 1
      --speculative-num-draft-tokens 4
      --mamba-radix-cache-strategy extra_buffer_lazy
      --max-running-requests 4
      --max-mamba-cache-size 12
      --mamba-ssm-dtype bfloat16
      --reasoning-parser qwen3
      --mem-fraction-static 0.96
      --ple-offload-embedding
      --watchdog-timeout 3600
    env:
      - "CUDA_VISIBLE_DEVICES=5"
      - "SGLANG_OPT_MAMBA_SKIP_DECODE_LOCK=1"
      - "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True"
    filters:
      setParams:
        # sglang 逐请求投机解码统计（响应 sglext.spec_tokens_details）；
        # 本地补丁版 llama-swap 解析入 Drafted 列（见 docs/llama-swap.md）
        return_spec_tokens_details: true
        # sglang 流式响应仅在显式 include_usage 时于末块返回 usage（OpenAI 惯例），
        # 为 Activity 页 token 数与客户端 decode 速率测量提供数据源
        stream_options:
          include_usage: true
    description: "MoE model (125B/6B active) from Aliyun Qwen, NVFP4, SGLang backend"
    metadata:
      port: ${PORT}
      note: "The ${MODEL_ID} is running on port ${PORT}, context=${ctx_256k}"
    ttl: 36000
    sendLoadingState: true
    timeouts:
      connect: 30
      keepalive: 30
      responseHeader: 600
      tlsHandshake: 10
      idleConn: 90
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      reranker: false
      context: 262144


# hooks: a dictionary of event triggers and actions
# - optional, default: empty dictionary
# - the only supported hook is on_startup
hooks:
  # on_startup: a dictionary of actions to perform on startup
  # - optional, default: empty dictionary
  # - the only supported action is preload
  on_startup:
    # preload: a list of model ids to load on startup
    # - optional, default: empty list
    # - model names must match keys in the models sections
    # - when preloading multiple models at once, define a group
    #   otherwise models will be loaded and swapped out
    preload:
      #- "Qwen3.8-27B"

# routing:
# Controls how llama-swap decides which models can run at the same time and
# which get swapped out. Choose one of two swap engines:
#
# - group:  the default engine. Simpler to configure. You define groups of
#           models that run together, and loading one group typically unloads
#           the others.
#
# - matrix: the newer engine. More involved to configure, but far more
#           flexible. It uses a small expression language to describe which
#           model combinations are allowed to run concurrently, enabling
#           setups that groups cannot express.
#
# The routing section is optional.
routing:
  router:
    # use: a string defining which engine to use
    # - optional, default: "group"
    # - valid values: group, matrix
    use: group

    # settings: a dictionary of settings for the specific engines
    settings:
      # groups: a dictionary of named groups
      # - optional, default: empty dictionary
      # - lets you keep some models loaded while others swap out
      # - every member must be a model ID defined in the models section
      # - a model can belong to only one group
      # - behaviour is set per group with the `swap`, `exclusive` and
      #   `persistent` fields
      # - see issue #109 for details
      #
      groups:
        # group1 reproduces llama-swap's default behaviour: only one model
        # runs at a time across the entire instance.
        "group1":
          # swap: how members of this group swap among themselves
          # - optional, default: true
          # - true:  only one member runs at a time
          # - false: all members can run together, no swapping
          swap: true

          # exclusive: how this group affects other groups
          # - optional, default: true
          # - true:  running a member unloads every other group
          # - false: running a member leaves other groups untouched
          exclusive: false

          # persistent: other groups cannot unload this group's members
          # - optional, default: false
          # - has no effect on swapping within the group
          persistent: true

          # members: the model IDs in this group
          # required
          members:
            - "Qwen3.8-27B"
            - "Qwen3.8-27B-vllm"
            - "Qwen3.8-27B-sglang"

        "group2":
          swap: true
          exclusive: false
          persistent: true
          members:
            - "Qwen3.8-Flash-Next"
            - "Qwen3.8-Flash-Next-vllm"
            - "Qwen3.8-Flash-Next-sglang"

      # The matrix lists the model combinations that are allowed to run
      # concurrently. When a model is requested, the solver makes room for it
      # by evicting as few running models as possible, preferring to keep the
      # costliest ones loaded.
      #
      # Solver behaviour:
      #   1. A request arrives for model X.
      #   2. If X is already running, forward the request. Done.
      #   3. Collect every set that contains X.
      #   4. For each set, add up the evict_costs of the running models that
      #      are NOT in that set — that is the set's cost.
      #   5. Choose the lowest-cost set. Break ties by definition order.
      #   6. Evict the models outside that set, start X, forward the request.
      #
      # Subset semantics: a set [a, b, c] also permits any subset of itself.
      # Only the requested model is started; the others are not preloaded.
      #
      # A model that appears in no set can only run on its own.
      #
      matrix:
        # vars: optional aliases for model IDs
        # - names may contain alphanumeric, "-", or "." characters (1-32 chars)
        # - map each short name to a real model ID (not a model alias)
        # - keeps the set expressions short and readable
        # - sets and evict_costs may mix vars with real model IDs
        # - a var takes precedence when its name is also a real model ID
        vars:
          q27b: Qwen3.8-27B
          q38fn: Qwen3.8-Flash-Next

        # evict_costs: relative cost of losing a running model (default: 1)
        evict_costs:
          q27b: 54 # 27B dense
          q38fn: 120

        # sets: named combinations of models that may run together.
        # Each value is an expression built from these operators:
        #   &     AND   (models run together)
        #   |     OR    (alternatives)
        #   ()    grouping
        #   +ref  inline the expression of another set
        #
        # Each expression expands into one or more concrete sets:
        #   "model-a"            → [model-a]
        #   "a & b"              → [a, b]
        #   "a | b"              → [a], [b]
        #   "(a | b) & c"        → [a, c], [b, c]
        #   "(a | b) & (c | d)"  → [a,c], [a,d], [b,c], [b,d]
        #   "+llms & v"          → inline the llms set, then AND with v
        sets:
          # LLM switching
          standard: "q27b & q38fn"

  # scheduler: how queued requests are ordered.
  # The default and only valid scheduler is "fifo"
  scheduler:
    use: fifo
    settings:
      fifo:
        # priority: a dictionary of model ID -> priority
        # - optional, default: empty dictionary
        # - models default to priority 0
        # - higher priority requests are serviced first in the queue
        priority:
          Qwen3.8-27B: 10
          Qwen3.8-Flash-Next: 6
